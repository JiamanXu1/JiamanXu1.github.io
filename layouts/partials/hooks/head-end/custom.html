<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="shortcut icon" href="{{ "favicon.svg" | relURL }}">
<meta name="application-name" content="{{ site.Title }}">
<meta name="apple-mobile-web-app-title" content="{{ site.Title }}">
<meta name="theme-color" content="#0f766e">
{{ if .IsHome }}
<script>document.documentElement.classList.add('academic-video-intro');</script>
{{ end }}
<style>
  :root {
    --academic-accent: #0f766e;
    --academic-page-bg: linear-gradient(180deg, #f8fafc 0%, #ffffff 32rem);
    --academic-page-bg-dark: linear-gradient(180deg, #071827 0%, #111827 32rem);
  }

  body {
    background: var(--academic-page-bg);
  }

  .dark body {
    background: var(--academic-page-bg-dark);
  }

  article a {
    text-underline-offset: 0.18em;
  }

  .academic-video-intro:not(.academic-video-unlocked) body {
    overflow: hidden;
  }

  .academic-video-section {
    overflow: hidden;
    padding: 0 !important;
  }

  @media (prefers-reduced-motion: reduce) {
    .academic-video-intro:not(.academic-video-unlocked) body {
      overflow: auto;
    }
  }
</style>
