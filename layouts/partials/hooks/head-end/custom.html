<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">
<link rel="shortcut icon" href="{{ "favicon.svg" | relURL }}">
<meta name="application-name" content="{{ site.Title }}">
<meta name="apple-mobile-web-app-title" content="{{ site.Title }}">
<meta name="theme-color" content="#0f766e">
{{ if .IsHome }}
<script>document.documentElement.classList.add('academic-video-intro');</script>
{{ end }}
<style>
  :root {
    --academic-accent: #0f766e;
    --academic-page-bg: linear-gradient(180deg, #f8fafc 0%, #ffffff 32rem);
    --academic-page-bg-dark: linear-gradient(180deg, #071827 0%, #111827 32rem);
  }

  body {
    background: var(--academic-page-bg);
  }

  .dark body {
    background: var(--academic-page-bg-dark);
  }

  article a {
    text-underline-offset: 0.18em;
  }

  .navbar-home-script,
  .dark .navbar-home-script {
    color: #111111 !important;
    font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "URW Chancery L", cursive;
    font-size: 1.55rem;
    font-style: italic;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.015em;
    text-decoration: none;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: color 180ms ease, transform 180ms ease;
  }

  .navbar-home-script:hover,
  .dark .navbar-home-script:hover {
    color: #374151 !important;
    transform: translateY(-1px);
  }

  .academic-video-intro .page-header {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-0.75rem);
    transition: opacity 600ms ease, transform 600ms ease;
  }

  .academic-video-intro.academic-video-content-visible .page-header {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .academic-video-intro:not(.academic-video-unlocked) body {
    overflow: hidden;
  }

  .academic-video-section {
    overflow: hidden;
    padding: 0 !important;
  }

  @media (prefers-reduced-motion: reduce) {
    .academic-video-intro .page-header {
      opacity: 1;
      pointer-events: auto;
      transform: none;
      transition: none;
    }

    .academic-video-intro:not(.academic-video-unlocked) body {
      overflow: auto;
    }
  }
</style>
